# Publishes scheduled podcast episodes: narrated drafts with a `publish_on`
# day (set from the Queued group on /feed) go live once it arrives. The
# commit triggers the normal site rebuild.
name: publish-due

on:
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * *'

permissions:
  contents: write

concurrency:
  group: publish-due
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publish-due.mjs
      - name: Commit
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "publish: scheduled episodes"
          git push
